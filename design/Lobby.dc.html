<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Room lobby</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Source+Serif+4:opsz,wght@8..60,500;8..60,700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F6F6F3}
a{color:#3366CC}a:hover{color:#1F4FA8}
</style>
</helmet>
<div style="min-height: 900px; background: #F6F6F3; color: #1A1A1A; font-family: Inter, system-ui, sans-serif">
<header style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; padding: 20px 32px; border-bottom: 1px solid #DEDED8; background: #FFFFFF">
<a href="Main.dc.html" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: #1A1A1A">
<svg width="28" height="28" viewBox="0 0 28 28" fill="none" stroke="#1A1A1A" stroke-width="2" aria-hidden="true"><circle cx="6" cy="22" r="3"></circle><circle cx="22" cy="6" r="3"></circle><path d="M8.5 19.5 L13 15 L15 17 L19.5 8.5"></path></svg>
<span style="font-family: 'Source Serif 4', Georgia, serif; font-size: 24px; font-weight: 700">Wikirace</span>
</a>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px">
<span style="font-size: 14px; color: #5B5B55">Room</span>
<span style="font-family: ui-monospace, Menlo, monospace; font-size: 24px; font-weight: 700; letter-spacing: 0.2em">K7QF</span>
<button style="min-height: 44px; padding: 0 16px; border: 1px solid #C9C9C2; border-radius: 8px; background: #FFFFFF; font: inherit; font-weight: 500; display: flex; gap: 8px; align-items: center"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="5" y="5" width="9" height="9" rx="1.5"></rect><path d="M11 5V3.5A1.5 1.5 0 0 0 9.5 2h-6A1.5 1.5 0 0 0 2 3.5v6A1.5 1.5 0 0 0 3.5 11H5"></path></svg>Copy invite link</button>
</div>
</header>

<main style="max-width: 1120px; margin: 0 auto; padding: 40px 24px 64px; display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start">
<section style="flex: 999 1 560px; min-width: 0; background: #FFFFFF; border: 1px solid #DEDED8; border-radius: 12px; padding: 28px; display: flex; flex-direction: column; gap: 24px">
<div style="display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 8px">
<h1 style="margin: 0; font-family: 'Source Serif 4', Georgia, serif; font-size: 32px">Race settings</h1>
<span style="font-size: 13px; color: #5B5B55">Only the host can change these</span>
</div>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px">
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="start" style="font-size: 14px; font-weight: 600; color: #3D3D38">Start article</label>
<input id="start" value="Pickle" style="min-height: 48px; padding: 0 14px; border: 1px solid #C9C9C2; border-radius: 10px; font-family: 'Source Serif 4', Georgia, serif; font-size: 19px">
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="target" style="font-size: 14px; font-weight: 600; color: #3D3D38">Target article</label>
<input id="target" value="Napoleon" style="min-height: 48px; padding: 0 14px; border: 1px solid #F0C9AE; background: #FFF4EC; color: #9A3412; border-radius: 10px; font-family: 'Source Serif 4', Georgia, serif; font-size: 19px">
</div>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 10px">
<button style="min-height: 44px; padding: 0 16px; border: 1px solid #C9C9C2; border-radius: 8px; background: #FFFFFF; font: inherit; font-weight: 500">Random pair</button>
<button style="min-height: 44px; padding: 0 16px; border: 1px solid #C9C9C2; border-radius: 8px; background: #FFFFFF; font: inherit; font-weight: 500">Harder pair (5+ hops)</button>
<span style="align-self: center; font-size: 14px; color: #5B5B55">Solver: shortest path is 3 clicks</span>
</div>

<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px">
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="mode" style="font-size: 14px; font-weight: 600; color: #3D3D38">Win by</label>
<select id="mode" style="min-height: 48px; padding: 0 12px; border: 1px solid #C9C9C2; border-radius: 10px; font: inherit; background: #FFFFFF"><option>Fastest time</option><option>Fewest clicks</option></select>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="clicks" style="font-size: 14px; font-weight: 600; color: #3D3D38">Click limit</label>
<select id="clicks" style="min-height: 48px; padding: 0 12px; border: 1px solid #C9C9C2; border-radius: 10px; font: inherit; background: #FFFFFF"><option>No limit</option><option>5 clicks</option><option>6 clicks</option></select>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="time" style="font-size: 14px; font-weight: 600; color: #3D3D38">Time limit</label>
<select id="time" style="min-height: 48px; padding: 0 12px; border: 1px solid #C9C9C2; border-radius: 10px; font: inherit; background: #FFFFFF"><option>5 minutes</option><option>3 minutes</option><option>10 minutes</option></select>
</div>
</div>

<fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 4px">
<legend style="font-size: 14px; font-weight: 600; color: #3D3D38; margin-bottom: 8px">House rules</legend>
<label style="display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 48px; border-top: 1px solid #ECECE6"><span>Allow back button <span style="color: #5B5B55; font-size: 14px">(counts as a click)</span></span><input type="checkbox" style="width: 20px; height: 20px"></label>
<label style="display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 48px; border-top: 1px solid #ECECE6"><span>Allow navbox, “See also” and category links</span><input type="checkbox" style="width: 20px; height: 20px"></label>
<label style="display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 48px; border-top: 1px solid #ECECE6"><span>Show where opponents are <span style="color: #5B5B55; font-size: 14px">(off = clicks only)</span></span><input type="checkbox" checked="" style="width: 20px; height: 20px"></label>
<label style="display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 48px; border-top: 1px solid #ECECE6; border-bottom: 1px solid #ECECE6"><span>Let spectators join</span><input type="checkbox" checked="" style="width: 20px; height: 20px"></label>
</fieldset>
</section>

<aside style="flex: 1 1 300px; min-width: 0; display: flex; flex-direction: column; gap: 16px">
<div style="background: #FFFFFF; border: 1px solid #DEDED8; border-radius: 12px; padding: 24px; display: flex; flex-direction: column; gap: 4px">
<div style="display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px">
<h2 style="margin: 0; font-family: 'Source Serif 4', Georgia, serif; font-size: 24px">Players</h2>
<span style="font-size: 14px; color: #5B5B55">4 / 8</span>
</div>
<div style="display: flex; align-items: center; gap: 12px; min-height: 52px; border-top: 1px solid #ECECE6"><span style="width: 32px; height: 32px; border-radius: 16px; background: #3366CC; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px">V</span><span style="flex: 1; font-weight: 600">vedant <span style="font-weight: 400; color: #5B5B55; font-size: 13px">host · you</span></span><span style="font-size: 13px; font-weight: 600; color: #1E6B3A">Ready</span></div>
<div style="display: flex; align-items: center; gap: 12px; min-height: 52px; border-top: 1px solid #ECECE6"><span style="width: 32px; height: 32px; border-radius: 16px; background: #C2410C; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px">M</span><span style="flex: 1; font-weight: 600">maya</span><span style="font-size: 13px; font-weight: 600; color: #1E6B3A">Ready</span></div>
<div style="display: flex; align-items: center; gap: 12px; min-height: 52px; border-top: 1px solid #ECECE6"><span style="width: 32px; height: 32px; border-radius: 16px; background: #0F766E; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px">J</span><span style="flex: 1; font-weight: 600">jonah</span><span style="font-size: 13px; color: #5B5B55">Not ready</span></div>
<div style="display: flex; align-items: center; gap: 12px; min-height: 52px; border-top: 1px solid #ECECE6"><span style="width: 32px; height: 32px; border-radius: 16px; background: #6D28D9; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px">P</span><span style="flex: 1; font-weight: 600">priya</span><span style="font-size: 13px; font-weight: 600; color: #1E6B3A">Ready</span></div>
<div style="display: flex; align-items: center; gap: 12px; min-height: 52px; border-top: 1px dashed #C9C9C2; color: #5B5B55; font-size: 14px">+ 1 spectator watching</div>
</div>
<a href="Race.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 56px; border-radius: 10px; background: #3366CC; color: #FFFFFF; text-decoration: none; font-size: 18px; font-weight: 600">Start race</a>
<p style="margin: 0; font-size: 13px; color: #5B5B55; text-align: center">Everyone gets a 3-second countdown and loads the start article at once.</p>
</aside>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":900}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
